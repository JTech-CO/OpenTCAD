name: Experimental DEVSIM laboratory
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  numerical:
    name: Real DEVSIM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install explicitly pinned research dependencies
        run: python -m pip install -r backend/app/experimental/requirements.txt
      - name: Install Linux BLAS runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas0
      - name: Run native numerical and HTTP acceptance tests (not M3 qualification)
        env:
          OPENTCAD_TEST_DEVSIM: '1'
          PYTHONUTF8: '1'
        run: python -m unittest backend.tests.experimental.test_numerical backend.tests.experimental.test_service backend.tests.experimental.test_mos -v
      - name: Diagnose native loader on failed numerical checks
        if: failure()
        env:
          PYTHONUTF8: '1'
        run: |
          python -c "from backend.app.experimental.solver import solve_pn; from backend.app.experimental.contract import DEFAULT; print(solve_pn({**DEFAULT, 'voltageV': 0})['checks'])"
