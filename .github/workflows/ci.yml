name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Static web quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check planning and milestone records
        run: npm run check:planning && npm run check:m0 && npm run check:m1

      - name: Check Korean punctuation
        run: npm run check:ko-copy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build static artifact
        run: npm run build
